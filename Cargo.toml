[workspace]
resolver = "3"
members = ["crates/core", "crates/local-service", "crates/mcp", "crates/runner", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
dunce = "1.0.5"
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
toml = "1.2.1"
kanbania-core = { path = "crates/core" }
kanbania-local-service = { path = "crates/local-service" }
kanbania-runner = { path = "crates/runner" }
nix = { version = "0.31.3", default-features = false, features = ["process", "signal"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["creation-flags", "job-object", "kill-on-drop", "process-group", "tokio1"] }
rmcp = { version = "3.9.0", default-features = false }
same-file = "1.0.6"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-dialog = "2.8.4"
# HU-020: notificación del sistema al pedir permiso un agente (solo desde Rust; sin permisos JS).
tauri-plugin-notification = "=2.8.0"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
uuid = { version = "1.29.2", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

# https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
