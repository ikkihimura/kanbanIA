[package]
name = "kanbania-local-service"
description = "API local autenticada (solo loopback) del host de Kanban IA y su cliente"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["server"]
# Servidor (host). Sin ella queda solo el cliente, sin núcleo ni SQLite.
server = ["dep:axum", "dep:kanbania-core"]

[dependencies]
axum = { workspace = true, optional = true }
getrandom = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
kanbania-core = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }

[dev-dependencies]
kanbania-core = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }

[lints]
workspace = true
