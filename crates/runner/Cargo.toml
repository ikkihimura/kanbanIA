[package]
name = "kanbania-runner"
description = "Ejecución local de intentos de Kanban IA: worktrees de Git, procesos supervisados y salida acotada"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["supervisor"]
# Orquestación con el núcleo (SQLite). Sin ella quedan las piezas de bajo nivel (procesos,
# salida, worktrees, proceso de prueba), que se pueden comprobar para Windows sin compilar C.
supervisor = ["dep:kanbania-core"]

[[bin]]
name = "kanbania-test-process"
path = "src/bin/kanbania-test-process.rs"
test = false

# Agente ACP falso solo para pruebas de contrato (HU-019): la app nunca lo lanza.
[[bin]]
name = "kanbania-fake-acp"
path = "src/bin/kanbania-fake-acp/main.rs"
test = false

[dependencies]
dunce = { workspace = true }
kanbania-core = { workspace = true, optional = true }
process-wrap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
