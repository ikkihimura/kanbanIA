# Avisos de licencias de terceros (HU-022): `npm run licenses` → THIRD-PARTY-LICENSES.md.
# Lista de permitidos: una dependencia con otra licencia hace fallar la generación. Añadir una
# licencia aquí es una decisión del propietario (comprueba que sea compatible con MIT/Apache-2.0).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    # Copyleft por archivo: solo cssparser, cssparser-macros, dtoa-short, selectors y option-ext
    # (sin modificar). Basta con el aviso y su código fuente público (crates.io).
    "MPL-2.0",
]
# Plataformas de los instaladores (HU-022).
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
# Los crates propios (publish = false) no son de terceros.
private = { ignore = true }
